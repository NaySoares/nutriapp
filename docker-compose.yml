services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nutriapp
      POSTGRES_USER: nutriapp
      POSTGRES_PASSWORD: nutriapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutriapp -d nutriapp"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://nutriapp:nutriapp@db:5432/nutriapp?schema=public
      SESSION_SECRET: local-development-secret-change-me-please-32
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/web/out:/srv:ro
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
volumes:
  postgres_data:
